[source]
source_key = "metaquotes-demo-xauusd"
broker_name = "MetaQuotes Ltd"
server_name = "MetaQuotes-Demo"
environment = "demo"

dataset_symbol = "XAUUSD"
requested_symbol = "XAUUSD"

[market]
base_timeframe = "M5"
additional_native_timeframes = ["M15", "H1"]
timezone = "UTC"

[collection]
bar_chunk = "1month"
