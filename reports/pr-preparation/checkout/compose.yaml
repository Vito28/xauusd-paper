name: xaussd-paper

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gold_market_demo}
      POSTGRES_USER: ${POSTGRES_USER:-gold_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 stores version-specific PGDATA below this mount point.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GOLD_ENVIRONMENT: demo
      GOLD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gold_user}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-gold_market_demo}
      GOLD_LOG_LEVEL: ${GOLD_LOG_LEVEL:-INFO}
      GOLD_SAFETY_LAG_SECONDS: ${GOLD_SAFETY_LAG_SECONDS:-5}
      GOLD_STORE_VALID_TICK_RAW_PAYLOAD: "false"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    command:
      - /bin/sh
      - -c
      - >-
        uv run --no-sync alembic upgrade head &&
        exec uv run --no-sync uvicorn market.dashboard:app
        --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres_data:
